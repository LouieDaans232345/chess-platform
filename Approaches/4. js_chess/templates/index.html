<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Chess Analysis</title>

        <!-- chessboard.css -->
        <link rel="stylesheet" href="/static/css/chessboard-1.0.0.min.css">

        <!-- jquery.js -->
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

        <!-- bootstrap.css -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

        <!-- chess.js -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.2/chess.min.js"></script>

        <!-- chessboard.js -->
        <script src="{{ url_for('static', filename='js/chessboard-1.0.0.min.js') }}"></script>

    </head>

    <body>
        <div class="col">
            <div class="row">
                <div class="col">
                    <div class="card mt-2">
                        <div class="card-body">
                            <div class="row">
                                <div class="col-5">

                                    <!-- chess board view -->
                                    <div id="chess_board" class="mx-auto mb-2" style="width: 400px"></div>

                                    <!-- game controls -->
                                    <div class="row mx-auto" style="width: 400px">
                                        <div>
                                            <button id="new_game" class="btn btn-outline-secondary">New game</button>
                                            <button id="make_move" class="btn btn-outline-secondary">Make move</button>
                                            <button id="take_back" class="btn btn-outline-secondary">Take back</button>
                                            <button id="flip_board" class="btn btn-outline-secondary">Flip board</button>
                                        </div>
                                    </div>

                                </div>
                                <div class="col">

                                    <!-- game stats -->
                                    <strong>Status:</strong>
                                    <div id="status"></div>
                                    <div class="mt-2"><strong>FEN:</strong></div>
                                    <div id="fen"></div>
                                    <div class="mt-2"><strong>PGN:</strong></div>
                                    <div id="pgn"></div>
                                    <div class="mt-2"><strong>Top moves:</strong></div>
                                    <div id="top_moves"></div>

                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>

</html>

<!-- script.js -->
<script src="/static/js/script.js"></script>
